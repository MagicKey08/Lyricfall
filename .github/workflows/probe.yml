name: Probe lyric sources
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          note() { echo "::notice::$1 :: $(head -c 400 body.txt | tr -d '\n')"; }
          for q in "Softcore The Neighbourhood" "witchblades Lil Peep" "Lucid Dreams Juice WRLD" "Headlock Imogen Heap"; do
            e=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")
            curl -s -A "$UA" -H 'Referer: https://music.163.com/' "https://music.163.com/api/search/get?s=$e&type=1&limit=5&offset=0" -o body.txt
            id=$(python3 -c "import json;d=json.load(open('body.txt'));s=d['result']['songs'][0];print(s['id'])" 2>/dev/null)
            echo "::notice::netease search [$q] -> id=$id $(python3 -c "import json;d=json.load(open('body.txt'));print([(s['name'],s['artists'][0]['name'],s.get('duration')) for s in d['result']['songs'][:3]])" 2>&1 | head -c 300)"
            if [ -n "$id" ]; then curl -s -A "$UA" -H 'Referer: https://music.163.com/' "https://music.163.com/api/song/lyric?id=$id&lv=1&kv=1&tv=-1&yv=1" -o body.txt; note "netease lyric $id"; fi
            curl -s -A "$UA" "https://mobileservice.kugou.com/api/v3/search/song?format=json&page=1&pagesize=5&showtype=1&keyword=$e" -o body.txt; note "kugou search [$q]"
          done
