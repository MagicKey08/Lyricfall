pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the needed JDK (25 for 26.x) if it is missing.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lyricfall'

new groovy.json.JsonSlurper().parse(file('targets.json')).each { t ->
    include(":${t.name}")
    project(":${t.name}").projectDir = file("targets/${t.name}")
}
